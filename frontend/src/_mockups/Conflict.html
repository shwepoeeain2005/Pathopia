<!DOCTYPE html><html class="dark" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Pathopia - Resume Conflict</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&amp;family=Hanken+Grotesk:wght@400;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#261900",
                        "on-secondary-fixed-variant": "#523e6a",
                        "on-tertiary-fixed-variant": "#5d4200",
                        "primary-fixed": "#ecdcff",
                        "surface-tint": "#d1beee",
                        "surface-bright": "#4d3500",
                        "surface-variant": "#483000",
                        "surface-container": "#2c1d00",
                        "inverse-primary": "#675780",
                        "surface-container-highest": "#483000",
                        "on-primary": "#37294f",
                        "surface-container-low": "#271900",
                        "on-secondary": "#3a2752",
                        "on-tertiary-container": "#a67a00",
                        "secondary": "#d6bcf1",
                        "tertiary-container": "#221600",
                        "tertiary-fixed": "#ffdea3",
                        "outline": "#948f98",
                        "error-container": "#93000a",
                        "secondary-container": "#54406c",
                        "on-error-container": "#ffdad6",
                        "on-secondary-container": "#c7aee2",
                        "inverse-on-surface": "#422c00",
                        "on-primary-fixed": "#221439",
                        "on-tertiary": "#402d00",
                        "primary-container": "#1e1035",
                        "surface-container-high": "#3a2600",
                        "on-surface": "#ffdeaa",
                        "on-secondary-fixed": "#25123c",
                        "primary": "#d1beee",
                        "inverse-surface": "#ffdeaa",
                        "on-error": "#690005",
                        "secondary-fixed": "#eedbff",
                        "tertiary-fixed-dim": "#f7bd3d",
                        "surface-container-lowest": "#160c00",
                        "background": "#1d1100",
                        "surface-dim": "#1d1100",
                        "on-primary-container": "#8a7aa5",
                        "on-surface-variant": "#cbc4ce",
                        "tertiary": "#f7bd3d",
                        "secondary-fixed-dim": "#d6bcf1",
                        "outline-variant": "#49454d",
                        "primary-fixed-dim": "#d1beee",
                        "on-background": "#ffdeaa",
                        "on-primary-fixed-variant": "#4e4067",
                        "error": "#ffb4ab",
                        "surface": "#1d1100"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "8px",
                        "container-margin-mobile": "20px",
                        "gutter": "24px",
                        "section-gap": "64px",
                        "container-margin-desktop": "80px"
                    },
                    "fontFamily": {
                        "body-md": ["Hanken Grotesk"],
                        "headline-md": ["Playfair Display"],
                        "label-md": ["Hanken Grotesk"],
                        "headline-lg": ["Playfair Display"],
                        "headline-sm": ["Playfair Display"],
                        "headline-lg-mobile": ["Playfair Display"],
                        "body-lg": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-md": ["32px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-sm": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "headline-lg-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .glass-card {
            background-color: rgba(30, 16, 53, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(203, 196, 206, 0.15);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .btn-primary-3d {
            background: linear-gradient(135deg, #f7bd3d, #a67a00);
            box-shadow: 0 2px 0 #5d4200, 0 8px 16px rgba(247, 189, 61, 0.2);
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .btn-primary-3d:hover {
            transform: translateY(1px);
            box-shadow: 0 1px 0 #5d4200, 0 4px 8px rgba(247, 189, 61, 0.3);
            filter: brightness(1.1);
        }
        .btn-primary-3d:active {
            transform: translateY(2px);
            box-shadow: 0 0 0 #5d4200, 0 0px 0px rgba(247, 189, 61, 0);
        }

        .btn-secondary-glass {
            background-color: rgba(84, 64, 108, 0.3);
            border: 1px solid rgba(214, 188, 241, 0.2);
            transition: all 0.2s ease;
        }
        .btn-secondary-glass:hover {
            background-color: rgba(84, 64, 108, 0.5);
            border-color: rgba(214, 188, 241, 0.4);
        }

        .btn-ghost {
            background-color: transparent;
            transition: all 0.2s ease;
        }
        .btn-ghost:hover {
            background-color: rgba(255, 255, 255, 0.04);
            color: #f7bd3d;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex items-center justify-center relative overflow-hidden font-body-md antialiased px-4">
<!-- Modal Container -->
<div class="w-full max-w-lg">
<!-- Glassmorphism Card -->
<div class="glass-card rounded-[32px] overflow-hidden" style="border: 1px solid rgba(255, 180, 171, 0.25); box-shadow: rgba(0, 0, 0, 0.6) 0px 20px 60px, rgba(255, 180, 171, 0.08) 0px 0px 20px, rgba(255, 255, 255, 0.05) 0px 1px 0px inset;">
<!-- Content Area -->
<div class="p-10 flex flex-col items-center text-center">
<div class="w-20 h-20 rounded-full bg-error-container/30 flex items-center justify-center mb-8 border border-error/20">
<span class="material-symbols-outlined text-[40px] text-error">error_outline</span>
</div>
<!-- Header -->
<h2 class="font-headline-md text-headline-lg-mobile text-tertiary mb-4">
                    Unfinished Simulation
                </h2>
<!-- Body -->
<p class="font-body-md text-body-lg text-on-surface-variant px-4">
                    You currently have an active simulation in progress for <strong class="font-semibold text-primary-fixed">Software Engineer</strong>. Would you prefer to resume your journey, or begin a new path as a <strong class="font-semibold text-primary-fixed">Data Scientist</strong>?
                </p>
<!-- Warning -->
<div class="mt-6 w-full bg-error-container/20 border border-error/25 rounded-xl px-6 py-4">
<p class="font-body-md text-[14px] text-error leading-relaxed font-medium">
                        Starting a new simulation will overwrite your existing progress permanently.
                    </p>
</div>
</div>
<!-- Action Buttons Area -->
<div class="px-10 pb-10 flex flex-col gap-4 items-center justify-center w-full">
<div class="flex flex-col sm:flex-row gap-6 w-full">
<!-- Secondary Button (Start New) -->
<button class="btn-secondary-glass w-full sm:w-1/2 py-4 px-8 rounded-full font-label-md text-label-md text-secondary-fixed-dim flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-xl">add_circle</span>
                        Start New
                    </button>
<!-- Primary Button (Resume) -->
<button class="btn-primary-3d w-full sm:w-1/2 py-4 px-8 rounded-full font-label-md text-label-md text-background flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-xl fill" style="font-variation-settings: 'FILL' 1">play_arrow</span>
                        Resume
                    </button>
</div>
<!-- Ghost Cancel -->
<button class="btn-ghost w-full py-3 px-8 rounded-full font-label-md text-label-md text-on-surface-variant">
                    Cancel
                </button>
</div>
</div>
</div>


</body></html>
