spring.application.name=backend

# Neon PostgreSQL connection (DB_URL, DB_USER, DB_PASSWORD loaded from .env)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon's compute auto-suspends after ~5 min idle, which silently kills any
# connection HikariCP is still holding in the pool (its defaults - 10 min
# idle-timeout, 30 min max-lifetime - are both far longer than that, so a
# pooled connection can look fine to Hikari while Neon has already dropped
# it). keepalive-time pings idle connections well before Neon's suspend
# window so active use never trips it; max-lifetime/idle-timeout retire
# connections proactively so a stale one is never handed out.
spring.datasource.hikari.max-lifetime=270000
spring.datasource.hikari.idle-timeout=240000
spring.datasource.hikari.keepalive-time=240000
spring.datasource.hikari.connection-timeout=30000

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect